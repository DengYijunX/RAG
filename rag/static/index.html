<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG — 文档检索问答</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a1e;
    --surface: #242429;
    --surface-hover: #2c2c33;
    --border: #3a3a42;
    --text: #e8e4dd;
    --text-dim: #8b8a8e;
    --accent: #d4a853;
    --accent-glow: rgba(212, 168, 83, 0.15);
    --radius: 12px;
    --font-body: "Noto Serif SC", "Georgia", "Songti SC", serif;
    --font-mono: "JetBrains Mono", "Consolas", monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse at 60% 0%, rgba(212, 168, 83, 0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 30% 100%, rgba(212, 168, 83, 0.03) 0%, transparent 50%);
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 80px 24px 120px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 64px;
    animation: fadeUp 0.8s ease-out;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
    font-family: var(--font-mono);
  }

  .logo::before {
    content: "";
    display: block;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent);
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 1.05rem;
    color: var(--text-dim);
    font-weight: 400;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
    animation: fadeUp 0.8s ease-out 0.1s both;
  }

  .tab {
    padding: 10px 24px;
    font-size: 0.9rem;
    cursor: pointer;
    color: var(--text-dim);
    border: none;
    background: none;
    font-family: var(--font-body);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    margin-bottom: -1px;
  }

  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* Search */
  .query-panel {
    animation: fadeUp 0.8s ease-out 0.2s both;
  }

  .search-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  .search-input {
    flex: 1;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 1.05rem;
    font-family: var(--font-body);
    transition: all 0.25s;
    outline: none;
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  .search-input::placeholder { color: var(--text-dim); }

  .btn {
    padding: 16px 28px;
    border: none;
    border-radius: var(--radius);
    font-size: 0.95rem;
    font-family: var(--font-body);
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .btn-primary {
    background: var(--accent);
    color: #1a1a1e;
  }

  .btn-primary:hover {
    background: #e0b85e;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(212, 168, 83, 0.25);
  }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: var(--surface-hover);
    border-color: var(--text-dim);
  }

  /* Index Panel */
  .index-panel {
    display: none;
    animation: fadeUp 0.8s ease-out 0.2s both;
  }

  .index-panel.visible { display: block; }

  .path-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  .path-input {
    flex: 1;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 1.05rem;
    font-family: var(--font-mono);
    transition: all 0.25s;
    outline: none;
  }

  .path-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  /* Status */
  .status {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 32px;
    min-height: 24px;
    font-family: var(--font-mono);
  }

  .status.success { color: #7eb896; }
  .status.error { color: #c46e6e; }
  .status.loading { color: var(--accent); }

  /* Answer */
  .result {
    animation: fadeUp 0.5s ease-out;
    margin-bottom: 48px;
  }

  .answer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px 40px;
    margin-bottom: 24px;
    line-height: 1.9;
    font-size: 1.05rem;
  }

  .answer-card p { margin-bottom: 1em; }
  .answer-card p:last-child { margin-bottom: 0; }
  .answer-card strong { color: var(--accent); }

  .sources-heading {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin-bottom: 12px;
    font-family: var(--font-mono);
  }

  .source-tag {
    display: inline-block;
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-right: 8px;
    margin-bottom: 8px;
    font-family: var(--font-mono);
    transition: all 0.2s;
    cursor: default;
  }

  .source-tag:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .chunk-preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--text-dim);
    line-height: 1.7;
    border-left: 3px solid var(--accent);
  }

  .chunk-preview + .chunk-preview { margin-top: 8px; }

  .chunk-source {
    font-size: 0.75rem;
    font-family: var(--font-mono);
    color: var(--accent);
    margin-bottom: 6px;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 80px 0;
    color: var(--text-dim);
    animation: fadeUp 0.8s ease-out 0.3s both;
  }

  .empty-state .icon {
    font-size: 3rem;
    margin-bottom: 20px;
    opacity: 0.5;
  }

  .empty-state p {
    font-size: 1rem;
    max-width: 360px;
    margin: 0 auto;
    line-height: 1.8;
  }

  /* Loader */
  .loader {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .container { padding: 40px 16px 80px; }
    h1 { font-size: 1.6rem; }
    .search-row, .path-row { flex-direction: column; }
    .answer-card { padding: 24px 20px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">RAG · Knowledgebase</div>
    <h1>文档检索问答</h1>
    <p class="subtitle">基于本地知识库的智能检索与生成</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('query')">检索问答</button>
    <button class="tab" onclick="switchTab('index')">文档索引</button>
  </div>

  <!-- Query Panel -->
  <div class="query-panel" id="queryPanel">
    <div class="search-row">
      <input class="search-input" id="questionInput" placeholder="输入你想查询的问题…" autofocus
             onkeydown="if(event.key==='Enter') doQuery()">
      <button class="btn btn-primary" id="queryBtn" onclick="doQuery()">搜索</button>
    </div>
  </div>

  <!-- Index Panel -->
  <div class="index-panel" id="indexPanel">
    <div class="path-row">
      <input class="path-input" id="pathInput" value="文档/">
      <input class="path-input" id="globInput" value="*" style="flex:0.3;min-width:80px">
      <button class="btn btn-secondary" id="indexBtn" onclick="doIndex()">建索引</button>
    </div>
  </div>

  <div class="status" id="status"></div>

  <!-- Results -->
  <div id="results"></div>

  <!-- Empty State -->
  <div class="empty-state" id="emptyState">
    <div class="icon">&#x25A1;</div>
    <p>输入问题，从已索引的文档中检索相关片段，由 AI 生成回答</p>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', i === (tab === 'query' ? 0 : 1));
  });
  document.getElementById('queryPanel').style.display = tab === 'query' ? '' : 'none';
  document.getElementById('indexPanel').classList.toggle('visible', tab === 'index');
  if (tab === 'query') document.getElementById('questionInput').focus();
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls || '');
}

async function doIndex() {
  const btn = document.getElementById('indexBtn');
  const path = document.getElementById('pathInput').value.trim();
  if (!path) return;

  btn.disabled = true;
  setStatus('正在索引…', 'loading');
  document.getElementById('results').innerHTML = '';

  try {
    const r = await fetch('/index', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path, glob: document.getElementById('globInput').value })
    });
    const data = await r.json();
    if (data.status === 'ok') {
      setStatus(`索引完成 — ${data.documents} 个文档，${data.chunks} 个片段`, 'success');
    } else {
      setStatus(`目录中未找到支持的文档文件（.md / .txt / .pdf）`, 'error');
    }
  } catch (e) {
    setStatus('索引失败: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

async function doQuery() {
  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question) return;

  const btn = document.getElementById('queryBtn');
  btn.disabled = true;
  setStatus('检索中…', 'loading');
  document.getElementById('emptyState').style.display = 'none';

  try {
    const r = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question })
    });
    const data = await r.json();

    setStatus(`检索到 ${data.sources.length} 篇相关文档`, 'success');

    const results = document.getElementById('results');
    let html = '<div class="result">';

    // Answer card
    html += '<div class="answer-card">' + data.answer.replace(/\n/g, '<br>') + '</div>';

    // Sources
    html += '<div class="sources-heading">引用来源</div>';
    data.sources.forEach(s => { html += `<span class="source-tag">${escHtml(s)}</span>`; });

    // Chunk previews
    html += '<div style="margin-top:20px">';
    data.chunks.forEach(c => {
      html += `<div class="chunk-preview"><div class="chunk-source">${escHtml(c.source)}</div>${escHtml(c.content)}</div>`;
    });
    html += '</div></div>';

    results.innerHTML = html;
  } catch (e) {
    setStatus('查询失败: ' + e.message, 'error');
    document.getElementById('emptyState').style.display = '';
  } finally {
    btn.disabled = false;
  }
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
</script>
</body>
</html>
