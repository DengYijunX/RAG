<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG — 文档检索问答</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a1e;
    --surface: #242429;
    --surface-hover: #2c2c33;
    --border: #3a3a42;
    --text: #e8e4dd;
    --text-dim: #8b8a8e;
    --accent: #d4a853;
    --accent-glow: rgba(212, 168, 83, 0.15);
    --radius: 12px;
    --font-body: "Noto Serif SC", "Georgia", "Songti SC", serif;
    --font-mono: "JetBrains Mono", "Consolas", monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse at 60% 0%, rgba(212, 168, 83, 0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 30% 100%, rgba(212, 168, 83, 0.03) 0%, transparent 50%);
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 80px 24px 120px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 64px;
    animation: fadeUp 0.8s ease-out;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 24px;
    font-family: var(--font-mono);
  }

  .logo::before {
    content: "";
    display: block;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent);
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 1.05rem;
    color: var(--text-dim);
    font-weight: 400;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
    animation: fadeUp 0.8s ease-out 0.1s both;
  }

  .tab {
    padding: 10px 24px;
    font-size: 0.9rem;
    cursor: pointer;
    color: var(--text-dim);
    border: none;
    background: none;
    font-family: var(--font-body);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    margin-bottom: -1px;
  }

  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* Search */
  .query-panel {
    animation: fadeUp 0.8s ease-out 0.2s both;
  }

  .search-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  .search-input {
    flex: 1;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 1.05rem;
    font-family: var(--font-body);
    transition: all 0.25s;
    outline: none;
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  .search-input::placeholder { color: var(--text-dim); }

  .btn {
    padding: 16px 28px;
    border: none;
    border-radius: var(--radius);
    font-size: 0.95rem;
    font-family: var(--font-body);
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .btn-primary {
    background: var(--accent);
    color: #1a1a1e;
  }

  .btn-primary:hover {
    background: #e0b85e;
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(212, 168, 83, 0.25);
  }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: var(--surface-hover);
    border-color: var(--text-dim);
  }

  /* Index Panel */
  .index-panel {
    display: none;
    animation: fadeUp 0.8s ease-out 0.2s both;
  }

  .index-panel.visible { display: block; }

  .path-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  .path-input {
    flex: 1;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 1.05rem;
    font-family: var(--font-mono);
    transition: all 0.25s;
    outline: none;
  }

  .path-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  /* Status */
  .status {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 32px;
    min-height: 24px;
    font-family: var(--font-mono);
  }

  .status.success { color: #7eb896; }
  .status.error { color: #c46e6e; }
  .status.loading { color: var(--accent); }

  /* Answer */
  .result {
    animation: fadeUp 0.5s ease-out;
    margin-bottom: 48px;
  }

  .answer-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px 40px;
    margin-bottom: 24px;
    line-height: 1.9;
    font-size: 1.05rem;
  }

  .answer-card p { margin-bottom: 1em; }
  .answer-card p:last-child { margin-bottom: 0; }
  .answer-card strong { color: var(--accent); }

  .sources-heading {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin-bottom: 12px;
    font-family: var(--font-mono);
  }

  .source-tag {
    display: inline-block;
    padding: 6px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-right: 8px;
    margin-bottom: 8px;
    font-family: var(--font-mono);
    transition: all 0.2s;
    cursor: default;
  }

  .source-tag:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .chunk-preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--text-dim);
    line-height: 1.7;
    border-left: 3px solid var(--accent);
  }

  .chunk-preview + .chunk-preview { margin-top: 8px; }

  .chunk-source {
    font-size: 0.75rem;
    font-family: var(--font-mono);
    color: var(--accent);
    margin-bottom: 6px;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 80px 0;
    color: var(--text-dim);
    animation: fadeUp 0.8s ease-out 0.3s both;
  }

  .empty-state .icon {
    font-size: 3rem;
    margin-bottom: 20px;
    opacity: 0.5;
  }

  .empty-state p {
    font-size: 1rem;
    max-width: 360px;
    margin: 0 auto;
    line-height: 1.8;
  }

  /* Loader */
  .loader {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .container { padding: 40px 16px 80px; }
    h1 { font-size: 1.6rem; }
    .search-row, .path-row { flex-direction: column; }
    .answer-card { padding: 24px 20px; }
  }
  .knowledge-picker { margin-bottom: 24px; }
  .knowledge-picker label { display: block; margin-bottom: 8px; }
  .knowledge-picker select { width: 100%; padding: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  .knowledge-note { color: var(--text-dim); font-size: .88rem; margin-top: 10px; }
  .picker-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .picker-actions input[type="text"] { padding: 8px 10px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font: inherit; font-size: .85rem; }
  .picker-actions input[type="file"] { color: var(--text-dim); font-size: .82rem; max-width: 260px; }
  .source-link { background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--accent); cursor: pointer; font: inherit; font-size: .85rem; }
  .answer-card, .chunk-content { white-space: pre-wrap; overflow-wrap: anywhere; }
  .citation-card { margin-top: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .citation-card summary { cursor: pointer; color: var(--accent); }
  .chunk-content { margin: 14px 0; font-size: .9rem; }
  dialog { margin: auto; width: min(900px, 94vw); max-height: 88vh; padding: 24px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 12px; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin-top: 20px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">RAG · Knowledgebase</div>
    <h1>文档检索问答</h1>
    <p class="subtitle">选择知识库提问，逐条核对回答依据</p>
  </header>

  <div class="knowledge-picker">
    <label for="knowledgeBase">知识库</label>
    <select id="knowledgeBase" onchange="changeKnowledge()">
      <option value="">正在读取知识库列表…</option>
    </select>
    <p id="knowledgeNote" class="knowledge-note">正在读取知识库状态…</p>
    <div class="picker-actions">
      <input type="text" id="newBaseName" maxlength="80" placeholder="新知识库名称" aria-label="新知识库名称">
      <button class="source-link" type="button" id="createBaseBtn" onclick="createBase()">创建知识库</button>
      <button class="source-link" type="button" onclick="loadKnowledge()">刷新状态</button>
    </div>
    <div class="picker-actions">
      <input type="file" id="sourceFiles" multiple aria-label="选择要导入的文档">
      <button class="source-link" type="button" id="importBtn" onclick="importSources()">导入文档</button>
      <button class="source-link" type="button" id="buildBtn" onclick="buildIndex()">建立索引</button>
    </div>
    <p class="knowledge-note">导入会替换该知识库此前的文档集合；同名文件请先改名。支持 .md / .txt / .pdf。</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('query')">检索问答</button>
  </div>

  <!-- Query Panel -->
  <div class="query-panel" id="queryPanel">
    <div class="search-row">
      <input class="search-input" id="questionInput" aria-label="问题" maxlength="2000" placeholder="输入你想查询的问题…" autofocus
             onkeydown="if(event.key==='Enter') doQuery()">
      <button class="btn btn-primary" id="queryBtn" onclick="doQuery()">搜索</button>
    </div>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <!-- Results -->
  <div id="results"></div>

  <!-- Empty State -->
  <div class="empty-state" id="emptyState">
    <div class="icon">&#x25A1;</div>
    <p>选择知识库后输入问题。回答下方可展开参考片段，并查看对应原文。</p>
  </div>
</div>

<dialog id="sourceDialog" aria-labelledby="sourceTitle">
  <form method="dialog"><button class="source-link">关闭原文</button></form>
  <h2 id="sourceTitle">来源原文</h2>
  <pre id="sourceText"></pre>
</dialog>

<script>
let knowledgeCatalog = [];
let busy = false;
let sourceRequest = 0;

function currentBase() {
  return knowledgeCatalog.find(item => item.id === document.getElementById('knowledgeBase').value) || null;
}

async function api(path, options) {
  const response = await fetch(path, options);
  let payload = null;
  try { payload = await response.json(); } catch (error) { payload = null; }
  if (!response.ok) {
    const detail = payload && typeof payload.detail === 'string' ? payload.detail : `请求失败（${response.status}）`;
    throw new Error(detail);
  }
  return payload;
}

async function loadKnowledge(preselect) {
  const selector = document.getElementById('knowledgeBase');
  const wanted = preselect || selector.value;
  try {
    knowledgeCatalog = await api('/knowledge-bases');
  } catch (error) {
    document.getElementById('knowledgeNote').textContent = error.message;
    return;
  }
  const options = knowledgeCatalog.map(entry => {
    const option = document.createElement('option');
    option.value = entry.id;
    option.textContent = entry.ready ? entry.name : `${entry.name}（未建索引）`;
    return option;
  });
  selector.replaceChildren(...options);
  if (wanted && knowledgeCatalog.some(entry => entry.id === wanted)) selector.value = wanted;
  changeKnowledge();
}

function updateKnowledgeNote() {
  const entry = currentBase();
  const note = document.getElementById('knowledgeNote');
  if (!entry) { note.textContent = '还没有知识库，请先创建并导入文档。'; return; }
  const state = entry.ready ? `已建索引 · ${entry.chunk_count} 个片段` : (entry.imported ? '已导入，尚未建索引' : '尚未导入文档');
  note.textContent = `${entry.documents} 份文档 · ${state}。${entry.scope_note || entry.description || ''}`;
}

function changeKnowledge() {
  document.getElementById('results').replaceChildren();
  document.getElementById('questionInput').value = '';
  document.getElementById('emptyState').style.display = '';
  document.getElementById('sourceDialog').close();
  sourceRequest += 1;
  setStatus('', '');
  updateKnowledgeNote();
}

async function createBase() {
  const field = document.getElementById('newBaseName');
  const name = field.value.trim();
  if (!name) { setStatus('请先填写知识库名称', 'error'); return; }
  try {
    const base = await api('/knowledge-bases', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    });
    field.value = '';
    await loadKnowledge(base.id);
    setStatus(`已创建知识库「${base.name}」，接着导入文档。`, 'success');
  } catch (error) {
    setStatus('创建失败: ' + error.message, 'error');
  }
}

async function importSources() {
  const entry = currentBase();
  if (!entry) { setStatus('请先创建或选择知识库', 'error'); return; }
  const picker = document.getElementById('sourceFiles');
  if (!picker.files.length) { setStatus('请先选择要导入的文件（.md / .txt / .pdf）', 'error'); return; }
  const button = document.getElementById('importBtn');
  const body = new FormData();
  for (const file of picker.files) body.append('files', file, file.name);
  button.disabled = true;
  setStatus('正在导入…', 'loading');
  try {
    const result = await api(`/knowledge-bases/${entry.id}/sources`, { method: 'POST', body: body });
    picker.value = '';
    await loadKnowledge(entry.id);
    const reasons = { unsupported_media_type: '格式不支持', OSError: '读取失败' };
    const skipped = result.skipped.length
      ? '；未导入：' + result.skipped.map(item => `${item.source}（${reasons[item.reason] || item.reason}）`).join('、')
      : '';
    setStatus(`已导入 ${result.documents} 份文档、${result.chunks} 个片段（替换原有集合）${skipped}。`, 'success');
  } catch (error) {
    setStatus('导入失败: ' + error.message, 'error');
  } finally {
    button.disabled = false;
  }
}

async function buildIndex() {
  const entry = currentBase();
  if (!entry) { setStatus('请先创建或选择知识库', 'error'); return; }
  const button = document.getElementById('buildBtn');
  button.disabled = true;
  setStatus('正在建立索引…', 'loading');
  try {
    const info = await api(`/knowledge-bases/${entry.id}/index`, { method: 'POST' });
    await loadKnowledge(entry.id);
    setStatus(`索引完成 — ${info.documents} 份文档、${info.chunks} 个片段。`, 'success');
  } catch (error) {
    setStatus('建立索引失败: ' + error.message, 'error');
  } finally {
    button.disabled = false;
  }
}

async function viewSource(citation) {
  const requestId = ++sourceRequest;
  const dialog = document.getElementById('sourceDialog');
  document.getElementById('sourceTitle').textContent = citation.title;
  document.getElementById('sourceText').textContent = '正在读取原文…';
  dialog.showModal();
  try {
    const response = await fetch(citation.url);
    if (!response.ok) throw new Error('原文读取失败');
    const source = await response.json();
    if (requestId === sourceRequest) document.getElementById('sourceText').textContent = source.content;
  } catch (error) { if (requestId === sourceRequest) document.getElementById('sourceText').textContent = error.message; }
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', i === (tab === 'query' ? 0 : 1));
  });
  document.getElementById('queryPanel').style.display = tab === 'query' ? '' : 'none';
  if (tab === 'query') document.getElementById('questionInput').focus();
}

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls || '');
}

async function doQuery() {
  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question || busy) return;

  const btn = document.getElementById('queryBtn');
  const selector = document.getElementById('knowledgeBase');
  const kb = selector.value;
  if (!kb) { setStatus('请先创建或选择知识库', 'error'); return; }

  busy = true;
  selector.disabled = true;
  btn.disabled = true;
  const requestId = ++sourceRequest;
  setStatus('检索中…', 'loading');
  document.getElementById('results').replaceChildren();
  document.getElementById('emptyState').style.display = 'none';

  try {
    const data = await api(`/knowledge-bases/${kb}/query`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question })
    });
    const citations = data.citations || [];
    const status = data.status === 'clarify' ? '需要补充信息' : data.status === 'insufficient_evidence' ? '资料不足' : `返回 ${citations.length} 个参考片段`;
    setStatus(status, data.status === 'answer' ? 'success' : '');

    const results = document.getElementById('results');
    results.replaceChildren();
    const answer = document.createElement('div');
    answer.className = 'answer-card';
    answer.textContent = data.answer;
    results.append(answer);
    if (data.scope_note) {
      const note = document.createElement('p'); note.className = 'knowledge-note'; note.textContent = data.scope_note; results.append(note);
    }
    citations.forEach(citation => {
      const detail = document.createElement('details'); detail.className = 'citation-card';
      const summary = document.createElement('summary');
      const version = citation.version_year ? ` · ${citation.version_year} 年版` : '';
      summary.textContent = `[${citation.citation}] ${citation.title}${version}`;
      detail.append(summary);
      if (citation.article_labels && citation.article_labels.length) {
        const labels = document.createElement('p'); labels.className = 'knowledge-note'; labels.textContent = '片段涉及：' + citation.article_labels.join('、'); detail.append(labels);
      }
      const content = document.createElement('div'); content.className = 'chunk-content'; content.textContent = citation.content; detail.append(content);
      if (citation.url) {
        const button = document.createElement('button'); button.className = 'source-link'; button.textContent = '查看完整原文'; button.addEventListener('click', () => viewSource(citation)); detail.append(button);
      }
      results.append(detail);
    });
  } catch (e) {
    if (requestId === sourceRequest) {
      setStatus('查询失败: ' + e.message, 'error');
      document.getElementById('emptyState').style.display = '';
    }
  } finally {
    busy = false;
    selector.disabled = false;
    btn.disabled = false;
  }
}

loadKnowledge();
</script>
</body>
</html>
